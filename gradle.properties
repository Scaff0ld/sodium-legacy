# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# Only configure projects needed for the requested tasks. Without this, every task configures
# :fabric too, whose Loom requires a JVM 21+ daemon (even for :forge:* or :core:* tasks).
org.gradle.configureondemand=true

# Versions shared by all modules
mod_version=0.1.1
minecraft_version=1.8.9

# Legacy Fabric
yarn_build=604
fabric_loader_version=0.18.3

# Libraries (Java 8 compatible)
joml_version=1.10.7
fastutil_version=8.2.1
jetbrains_annotations_version=24.0.1
